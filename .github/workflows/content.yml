name: Weekly Article (Claude)
on:
  # 자동 예약 실행은 꺼둠 (API 키 미등록). 글은 Claude Code 세션에서 직접 작성.
  # 키를 등록하면 아래 두 줄의 주석을 풀어 다시 켤 수 있음.
  # schedule:
  #   - cron: '0 0 * * 1,4'   # 매주 월·목 09:00 KST
  workflow_dispatch:
    inputs:
      count:
        description: '생성할 글 수'
        default: '1'
permissions:
  contents: write
jobs:
  article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # Settings > Secrets 에 등록
          ARTICLE_MODEL: ${{ vars.ARTICLE_MODEL }}
        run: node scripts/generate-article.mjs --count ${{ github.event.inputs.count || 1 }}
      - name: Verify build
        run: node build.mjs
      - name: Commit & push
        run: |
          git config user.name "calcmate-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet && echo "변경 없음" || (git commit -m "content: auto article $(date +%F)" && git push)
